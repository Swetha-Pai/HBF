name: Custom.Linux.Search.FileFinder
description: |
  Find shell scripts (.sh) and Python files (.py) on the filesystem.

precondition:
  SELECT * FROM info() where OS = 'linux'

parameters:
  - name: SearchFilesGlobTable
    type: csv
    default: |
      Glob
      /home/**/*.sh
      /home/**/*.py
      /usr/local/bin/*.sh
      /usr/local/bin/*.py
      /usr/bin/*.sh
      /usr/bin/*.py
      /opt/**/*.sh
      /opt/**/*.py
    description: Multiple globs for .sh and .py files.

  - name: YaraRule
    type: yara
    default:
    description: Yara rule for content matching.

  - name: Upload_File
    default: N
    type: bool

  - name: Calculate_Hash
    default: N
    type: bool

  - name: MoreRecentThan
    default: ""
    type: timestamp

  - name: ModifiedBefore
    default: ""
    type: timestamp

  - name: ExcludePathRegex
    default: "^/(proc|sys|run|snap)"
    type: regex
    description: Exclude paths matching this regex.

  - name: LocalFilesystemOnly
    default: Y
    type: bool
    description: Restrict to local filesystems.

  - name: OneFilesystem
    default: N
    type: bool
    description: Avoid crossing filesystem boundaries.

  - name: DoNotFollowSymlinks
    type: bool
    default: N
    description: Follow symlinks during search.

sources:
- query: |
    LET LocalDeviceMajor <= (
       253,7,8,9,11,65,66,67,68,69,70,71,128,129,130,131,132,133,134,135,202,253,254,259)

    LET RecursionCallback = if(
        condition=LocalFilesystemOnly,
        then=if(condition=ExcludePathRegex,
                then="x=>x.Data.DevMajor IN LocalDeviceMajor AND NOT x.OSPath =~ ExcludePathRegex",
                else="x=>x.Data.DevMajor IN LocalDeviceMajor"),
        else=if(condition=ExcludePathRegex,
                then="x=>NOT x.OSPath =~ ExcludePathRegex",
                else=""))

    LET file_search = SELECT 
        OSPath,
        Sys.mft as Inode,
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime,
        Atime AS ATime,
        Ctime AS CTime,
        IsDir, 
        Mode, 
        Data
    FROM glob(
        globs=SearchFilesGlobTable.Glob,
        recursion_callback=RecursionCallback,
        one_filesystem=OneFilesystem,
        accessor="file", 
        nosymlink=DoNotFollowSymlinks
    )
    WHERE OSPath =~ '.*\.(sh|py)$'

    LET more_recent = SELECT * FROM if(
        condition=MoreRecentThan,
        then={ SELECT * FROM file_search WHERE MTime > MoreRecentThan },
        else={ SELECT * FROM file_search })

    LET modified_before = SELECT * FROM if(
        condition=ModifiedBefore,
        then={ SELECT * FROM more_recent WHERE MTime < ModifiedBefore },
        else={ SELECT * FROM more_recent })

    LET keyword_search = SELECT * FROM if(
        condition=YaraRule,
        then={
            SELECT * FROM foreach(
                row={ SELECT * FROM modified_before WHERE Mode.IsRegular },
                query={
                    SELECT 
                        OSPath, 
                        Inode, 
                        Mode,
                        Size, 
                        ATime, 
                        MTime, 
                        CTime,
                        str(str=String.Data) As Keywords
                    FROM yara(
                        files=OSPath,
                        key="A",
                        rules=YaraRule,
                        accessor="file"
                    )
                })
        },
        else={
            SELECT *, NULL AS Keywords FROM modified_before
        })

    SELECT 
        OSPath, 
        Inode, 
        Mode, 
        Size, 
        ATime,
        MTime, 
        CTime, 
        Keywords,
        if(condition=Upload_File and Mode.IsRegular,
            then=upload(file=OSPath, accessor="file")) AS Upload,
        if(condition=Calculate_Hash and Mode.IsRegular,
            then=hash(path=OSPath, accessor="file")) AS Hash
    FROM keyword_search

column_types:
  - name: ATime
    type: timestamp
  - name: MTime
    type: timestamp
  - name: CTime
    type: timestamp
  - name: Upload
    type: preview_upload
