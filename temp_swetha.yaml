name: Custom.Linux.Search.FileFinder
description: |
  Find .sh and .py files on Linux systems (static filesystem config).

precondition:
  SELECT * FROM info() where OS = 'linux'

parameters:
  - name: SearchFilesGlobTable
    type: csv
    static: true
    default: |
      Glob
      /home/**/*.sh
      /home/**/*.py
      /usr/local/bin/*.sh
      /usr/local/bin/*.py
      /usr/bin/*.sh
      /usr/bin/*.py
      /opt/**/*.sh
      /opt/**/*.py
    description: Predefined search locations.

  - name: Upload_File
    default: N
    type: bool

  - name: Calculate_Hash
    default: N
    type: bool

  - name: MoreRecentThan
    default: ""
    type: timestamp

  - name: ModifiedBefore
    default: ""
    type: timestamp

  - name: ExcludePathRegex
    default: "^/(proc|sys|run|snap)"
    type: regex
    description: Exclude system paths.

sources:
- query: |
    LET LocalDeviceMajor <= (253,7,8,9,11,65,66,67,68,69,70,71,128,129,130,131,132,133,134,135,202,253,254,259)

    -- Static configuration:
    -- LocalFilesystemOnly=true, OneFilesystem=false, DoNotFollowSymlinks=false
    LET RecursionCallback = if(
        condition=ExcludePathRegex,
        then="x=>x.Data.DevMajor IN LocalDeviceMajor AND NOT x.OSPath =~ ExcludePathRegex",
        else="x=>x.Data.DevMajor IN LocalDeviceMajor")

    LET file_search = SELECT 
        OSPath,
        Sys.mft as Inode,
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime,
        Atime AS ATime,
        Ctime AS CTime,
        IsDir, 
        Mode, 
        Data
    FROM glob(
        globs=SearchFilesGlobTable.Glob,
        recursion_callback=RecursionCallback,
        one_filesystem=false,    -- Hardcoded N
        accessor="file", 
        nosymlink=false          -- Hardcoded N
    )
    WHERE OSPath =~ '.*\.(sh|py)$'

    LET more_recent = SELECT * FROM if(
        condition=MoreRecentThan,
        then={ SELECT * FROM file_search WHERE MTime > MoreRecentThan },
        else=file_search)

    LET modified_before = SELECT * FROM if(
        condition=ModifiedBefore,
        then={ SELECT * FROM more_recent WHERE MTime < ModifiedBefore },
        else=more_recent)

    SELECT 
        OSPath, 
        Inode, 
        Mode, 
        Size, 
        ATime,
        MTime, 
        CTime,
        if(condition=Upload_File and Mode.IsRegular,
            then=upload(file=OSPath)) AS Upload,
        if(condition=Calculate_Hash and Mode.IsRegular,
            then=hash(path=OSPath)) AS Hash
    FROM modified_before

column_types:
  - name: ATime
    type: timestamp
  - name: MTime
    type: timestamp
  - name: CTime
    type: timestamp
  - name: Upload
    type: preview_upload
