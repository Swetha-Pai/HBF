name: Custom.Linux.Search.FileFinder
description: |
  Find shell scripts (.sh) and Python files (.py) on the filesystem.

parameters:
  - name: SearchFilesGlob
    default: /home/**/*.{sh,py}  # Modified glob pattern
    description: Use a glob to define files that will be searched (.sh/.py).

  - name: SearchFilesGlobTable
    type: csv
    default: |
      Glob
      /usr/local/bin/*.{sh,py}  # Added Python pattern
      /usr/bin/*.{sh,py}        # Added Python pattern
    description: Alternative specify multiple globs in a table for scripts

sources:
- query: |
    # [Previous LET statements unchanged]

    LET file_search = SELECT OSPath,
               Sys.mft as Inode,
               Mode.String AS Mode, Size,
               Mtime AS MTime,
               Atime AS ATime,
               Ctime AS CTime,
               IsDir, Mode, Data
        FROM glob(globs=SearchFilesGlobTable.Glob + SearchFilesGlob,
                  recursion_callback=RecursionCallback,
                  one_filesystem=OneFilesystem,
                  accessor="file", nosymlink=DoNotFollowSymlinks)
        WHERE OSPath =~ '.*\.(sh|py)$'  # Modified regex filter

    # [Remaining query unchanged]
