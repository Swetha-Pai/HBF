name: Linux.Detection.MultiTypeMalwareHunt
description: |
  Hunt for potential Linux malware files: ELF binaries, scripts, JARs, web shells, kernel modules, and suspicious executables in common dropper locations.
parameters:
  - name: SearchPaths
    default:
      - "/usr/bin"
      - "/usr/local/bin"
      - "/bin"
      - "/sbin"
      - "/lib"
      - "/lib64"
      - "/tmp"
      - "/var/tmp"
      - "/home"
      - "/var/www"
    description: "Directories to search for suspicious files."
sources:
  - precondition: SELECT OS FROM info() WHERE OS = 'linux'
    query: |
      LET patterns = [
        "*.elf", "*.bin", "*.out", "*.so", "*.ko", "*.py", "*.pl", "*.sh",
        "*.php", "*.jsp", "*.jar"
      ]
      LET script_exts = ["py", "pl", "sh"]
      LET webshell_exts = ["php", "jsp"]
      LET suspicious_files = foreach(pattern IN patterns,
        SELECT FullPath, OSPath.Basename() AS Name, OSPath.Extension() AS Ext,
               stat.mode AS Mode, stat.size AS Size,
               stat.mtime AS MTime, stat.ctime AS CTime, stat.atime AS ATime
        FROM glob(globs=SearchPaths + ["/**/" + pattern], nosymlink=true, exclude_dirs=["/proc","/sys","/dev"])
      )
      LET exec_files = SELECT FullPath, OSPath.Basename() AS Name, OSPath.Extension() AS Ext,
                              stat.mode AS Mode, stat.size AS Size,
                              stat.mtime AS MTime, stat.ctime AS CTime, stat.atime AS ATime
                       FROM glob(globs=SearchPaths + ["/**/*"], nosymlink=true, exclude_dirs=["/proc","/sys","/dev"])
                       WHERE stat.mode & 0o111 != 0 AND stat.uid != 0
      SELECT * FROM suspicious_files
      UNION
      SELECT * FROM exec_files
