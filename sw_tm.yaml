name: Linux.Detection.MultiTypeMalwareHunt
type: CLIENT
description: |
  Hunt for potential Linux malware files using Custom.Linux.Search.FileFinder:
   - ELF binaries and shared objects (.elf, .bin, .so, .ko)
   - Scripts (.sh, .py, .pl)
   - Web shells (.php, .jsp)
   - Java archives (.jar)
   - Any executable in /tmp, /var/tmp, /home, /var/www not owned by root
precondition: |
  SELECT OS FROM info() WHERE OS = 'Linux'
sources:
  - name: MultiTypeMalwareFinder
    artifact: Custom.Linux.Search.FileFinder
    parameters:
      SearchFilesGlob: ""
      SearchFilesGlobTable: |
        Glob
        /usr/bin/**/*.elf
        /usr/local/bin/**/*.elf
        /usr/bin/**/*.bin
        /usr/local/bin/**/*.bin
        /usr/bin/**/*.so
        /usr/local/bin/**/*.so
        /usr/bin/**/*.ko
        /usr/local/bin/**/*.ko
        /usr/bin/**/*.sh
        /usr/bin/**/*.py
        /usr/bin/**/*.pl
        /usr/bin/**/*.php
        /usr/bin/**/*.jsp
        /usr/bin/**/*.jar
        /tmp/**/*
        /var/tmp/**/*
        /home/**/*
        /var/www/**/*
      YaraRule: ""
      Upload_File: "N"
      Calculate_Hash: "Y"
      MoreRecentThan: ""
      ModifiedBefore: ""
      ExcludePathRegex: "^/(proc|sys|run|snap)"
      LocalFilesystemOnly: "Y"
      OneFilesystem: "N"
      DoNotFollowSymlinks: "Y"
    query: |
      LET malware_extensions = dict(
        elf=TRUE, bin=TRUE, so=TRUE, ko=TRUE,
        sh=TRUE, py=TRUE, pl=TRUE,
        php=TRUE, jsp=TRUE, jar=TRUE
      )
      
      LET drop_dirs = dict(
        "/tmp/"=TRUE, 
        "/var/tmp/"=TRUE, 
        "/home/"=TRUE, 
        "/var/www/"=TRUE
      )
      
      SELECT
        OSPath                AS Path,
        OSPath.Basename()     AS Name,
        OSPath.Extension()    AS Ext,
        Mode                  AS Perms,
        Hash.MD5              AS MD5,
        Hash.SHA1             AS SHA1,
        Hash.SHA256           AS SHA256,
        MTime                 AS MTime,
        stat.uid              AS UID,
        if(condition= OSPath.Extension() in malware_extensions,
           then="known_extension",
           else=if(condition= Mode =~ "x" AND stat.uid != 0 AND 
                  (OSPath.Dirname() =~ "^/tmp/" OR 
                   OSPath.Dirname() =~ "^/var/tmp/" OR 
                   OSPath.Dirname() =~ "^/home/" OR 
                   OSPath.Dirname() =~ "^/var/www/"),
                  then="dropped_executable",
                  else="other")) AS Reason
      FROM source()
      WHERE 
        OSPath.Extension() in malware_extensions
        OR
        (Mode =~ "x" AND stat.uid != 0 AND 
         (OSPath.Dirname() =~ "^/tmp/" OR 
          OSPath.Dirname() =~ "^/var/tmp/" OR 
          OSPath.Dirname() =~ "^/home/" OR 
          OSPath.Dirname() =~ "^/var/www/"))
