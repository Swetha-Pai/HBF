name: Custom.Detection.CommandLineDownloads
description: |
  Detects wget/curl downloads with or without explicit output flags,
  including indirect file operations.
  Extracts the download tool used, the URL, the downloaded filename,
  and the full path to the history file where the command was found.

parameters:
  - name: HistoryPaths
    default: |
      /home/*/.*_history
      /root/.*_history
      C:\\Users\\*\\AppData\\Roaming\\Microsoft\\Windows\\PowerShell\\*\\History*

sources:
  - query: |
      LET history_files = SELECT OSPath, Mtime, Username
        FROM glob(globs=split(string=HistoryPaths, sep="\n"))
        WHERE Size > 0

      SELECT * FROM foreach(
        row=history_files,
        query={
          LET download_url = regex_search(
            source=Line,
            regex="(https?://\\S+)",
            group=0
          )
          LET downloaded_filename = if(
            condition=download_url,
            then=basename(download_url),
            else=null()
          )
          
          SELECT
            OSPath AS CurrentFilePath,
            Mtime,
            Username,
            Line AS FullCommand,
            if(
              condition=Line =~ "(wget|curl)\\s+.*https?://",
              then=regex_replace(
                source=Line,
                re=".*(wget|curl)\\b.*",
                replace="$1"
              )
            ) AS DownloadTool,
            download_url AS DownloadURL,
            downloaded_filename AS DownloadedFilename
          FROM parse_lines(filename=OSPath, accessor="auto")
          WHERE DownloadTool
        }
      )
