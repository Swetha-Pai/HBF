name: Custom.Detection.CommandLineDownloads
description: |
  Detects wget/curl downloads with or without explicit output flags,
  including indirect file operations. Adds a column with the downloaded filename.

parameters:
  - name: HistoryPaths
    default: |
      /home/*/.*_history
      /root/.*_history
      C:\\Users\\*\\AppData\\Roaming\\Microsoft\\Windows\\PowerShell\\*\\History*

sources:
  - query: |
      LET history_files = SELECT OSPath, Mtime, Username
        FROM glob(globs=split(string=HistoryPaths, sep="\n"))
        WHERE Size > 0

      SELECT * FROM foreach(
        row=history_files,
        query={
          SELECT
            OSPath,
            Mtime,
            Username,
            Line AS FullCommand,

            # Extract wget or curl
            regex_replace(
              source=Line,
              re=".*\\b(wget|curl)\\b.*",
              replace="$1"
            ) AS DownloadTool,

            # Filename: prefer -O/--output, else last URL segment
            if(
              condition=Line =~ "(?:-O|--output(?:-document)?)[ =]+[\\w.\\-/\\\\]+",
              then=regex_replace(
                source=Line,
                re=".*(?:-O|--output(?:-document)?)[ =]+([\\w.\\-/\\\\]+).*",
                replace="$1"
              ),
              else=regex_replace(
                source=Line,
                re=".*https?://[^\\s]+/([^\\s/]+)(?:\\s|$).*",
                replace="$1"
              )
            ) AS Filename

          FROM parse_lines(filename=OSPath, accessor="auto")
          WHERE Line =~ "\\b(wget|curl)\\b" AND Line =~ "https?://"
        }
      )
