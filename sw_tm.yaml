name: Custom.Detection.CommandLineDownloads
description: |
  Detects wget/curl downloads with or without explicit output flags,
  including indirect file operations, and reports the downloaded
  filename and its resolved location on disk.

parameters:
  - name: HistoryPaths
    default: |
      /home/*/.*_history
      /root/.*_history
      C:\\Users\\*\\AppData\\Roaming\\Microsoft\\Windows\\PowerShell\\*\\History*

sources:
  - query: |
      LET history_files = SELECT OSPath, Mtime, Username
        FROM glob(globs=split(string=HistoryPaths, sep="\n"))
        WHERE Size > 0

      SELECT *
        FROM foreach(
          row=history_files,
          query={
            SELECT
              OSPath,
              Mtime,
              Username,
              Line AS FullCommand,
              if(
                condition = Line =~ "(wget|curl)\\s+.*https?://",
                then      = regex_replace(source=Line, re=".*(wget|curl)\\b.*", replace="$1")
              ) AS DownloadTool,
              regex_search(Line, "(https?://[^\\s'\"]+)") AS DownloadURL,
              if(
                condition = Line =~ "(?:-O|--output|--output-document)\\s+([^\\s]+)",
                then      = regex_search(Line, "(?:-O|--output|--output-document)\\s+([^\\s]+)"),
                else      = regex_replace(
                              source = regex_search(Line, "(https?://[^\\s'\"]+)"),
                              re     = ".*/([^/?#]+).*",
                              replace= "\\1"
                            )
              ) AS OutputFile,
              (
                SELECT path
                  FROM file
                 WHERE name = (
                   if(
                     Line =~ "(?:-O|--output|--output-document)\\s+([^\\s]+)",
                     regex_search(Line, "(?:-O|--output|--output-document)\\s+([^\\s]+)"),
                     regex_replace(
                       source = regex_search(Line, "(https?://[^\\s'\"]+)"),
                       re     = ".*/([^/?#]+).*",
                       replace= "\\1"
                     )
                   )
                 )
                 LIMIT 1
              ) AS FilePath
            FROM parse_lines(filename=OSPath, accessor="auto")
           WHERE Line =~ "(wget|curl)\\s+.*https?://"
          }
        )
