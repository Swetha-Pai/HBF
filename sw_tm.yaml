name: Custom.Detection.CommandLineDownloads
description: |
  Detects wget/curl downloads with or without explicit output flags,
  including indirect file operations.
  Extracts the download tool used, the URL, the downloaded filename,
  and the full path to the history file where the command was found.

parameters:
  - name: HistoryPaths
    default: |
      /home/*/.*_history
      /root/.*_history
      C:\\Users\\*\\AppData\\Roaming\\Microsoft\\Windows\\PowerShell\\*\\History*

sources:
  - query: |
      LET history_files = SELECT OSPath, Mtime, Username
        FROM glob(globs=split(string=HistoryPaths, sep="\n"))
        WHERE Size > 0

      SELECT 
        history_files.OSPath AS CurrentFilePath,
        history_files.Mtime,
        history_files.Username,
        line AS FullCommand,
        if(
          condition=line =~ "(wget|curl)\\s+.*https?://",
          then=regex_replace(
            source=line,
            re=".*(wget|curl)\\b.*",
            replace="$1"
          )
        ) AS DownloadTool,
        regex_search(source=line, regex="(https?://\\S+)", group=0) AS DownloadURL,
        if(
          condition=regex_search(source=line, regex="(https?://\\S+)", group=0),
          then=basename(regex_search(source=line, regex="(https?://\\S+)", group=0)),
          else=null()
        ) AS DownloadedFilename
      FROM foreach(
        row=history_files,
        query={
          SELECT
            row.OSPath,
            row.Mtime,
            row.Username,
            row.Line
          FROM parse_lines(filename=row.OSPath, accessor="auto")
          WHERE row.Line =~ "(wget|curl)\\s+.*https?://"
        }
      )
