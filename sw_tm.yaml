name: Custom.Linux.MaliciousFileFinder
description: |
  Find potentially malicious files on Linux systems including:
  - ELF binaries (native executables)
  - Shell/Python/Perl scripts
  - Java JAR files
  - Malicious web shells (.php, .jsp, etc.)
  - Kernel modules (.ko)
  - Suspicious files in common dropper locations
  - Files with executable permissions in user-writable directories

precondition:
  SELECT * FROM info() where OS = 'linux'

parameters:
  - name: Upload_File
    default: N
    type: bool

  - name: Calculate_Hash
    default: N
    type: bool

  - name: MoreRecentThan
    default: ""
    type: timestamp

  - name: ModifiedBefore
    default: ""
    type: timestamp

  - name: ExcludePathRegex
    default: "^/(proc|sys|run|snap)"
    type: regex
    description: Exclude system paths.

sources:
- query: |
    LET LocalDeviceMajor <= (253,7,8,9,11,65,66,67,68,69,70,71,128,129,130,131,132,133,134,135,202,253,254,259)

    LET RecursionCallback = if(
        condition=ExcludePathRegex,
        then="x=>x.Data.DevMajor IN LocalDeviceMajor AND NOT x.OSPath =~ ExcludePathRegex",
        else="x=>x.Data.DevMajor IN LocalDeviceMajor")

    -- Scripts and executables in standard locations
    LET script_globs = (
      "/home/**/*.sh",
      "/home/**/*.py",
      "/home/**/*.pl",
      "/usr/local/bin/*.sh",
      "/usr/local/bin/*.py",
      "/usr/local/bin/*.pl",
      "/usr/bin/*.sh",
      "/usr/bin/*.py",
      "/usr/bin/*.pl",
      "/opt/**/*.sh",
      "/opt/**/*.py",
      "/opt/**/*.pl"
    )
    
    -- Web shells in web directories
    LET webshell_globs = (
      "/var/www/**/*.php",
      "/var/www/**/*.jsp",
      "/var/www/**/*.asp",
      "/var/www/**/*.aspx",
      "/var/www/**/*.cgi",
      "/usr/share/nginx/**/*.php",
      "/usr/share/nginx/**/*.jsp",
      "/usr/share/apache*/**/*.php",
      "/usr/share/apache*/**/*.jsp"
    )
    
    -- Java JAR files
    LET jar_globs = (
      "/home/**/*.jar",
      "/opt/**/*.jar",
      "/usr/local/**/*.jar",
      "/var/www/**/*.jar"
    )
    
    -- Kernel modules
    LET kernel_module_globs = (
      "/lib/modules/**/*.ko",
      "/usr/lib/modules/**/*.ko",
      "/home/**/*.ko"
    )
    
    -- Common dropper locations
    LET dropper_location_globs = (
      "/tmp/**",
      "/var/tmp/**",
      "/dev/shm/**"
    )
    
    -- Find shell scripts
    LET shell_script_results = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        IsDir, Mode, "Shell script" AS FileType
    FROM glob(
        globs=script_globs,
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE OSPath =~ '.*\\.sh$' AND NOT IsDir
    
    -- Find python scripts
    LET python_script_results = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        IsDir, Mode, "Python script" AS FileType
    FROM glob(
        globs=script_globs,
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE OSPath =~ '.*\\.py$' AND NOT IsDir
    
    -- Find perl scripts
    LET perl_script_results = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        IsDir, Mode, "Perl script" AS FileType
    FROM glob(
        globs=script_globs,
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE OSPath =~ '.*\\.pl$' AND NOT IsDir
    
    -- Find web shells
    LET webshell_results = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        IsDir, Mode, "Web shell" AS FileType
    FROM glob(
        globs=webshell_globs,
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE OSPath =~ '.*\\.(php|jsp|asp|aspx|cgi)$' AND NOT IsDir
    
    -- Find JAR files
    LET jar_results = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        IsDir, Mode, "Java JAR" AS FileType
    FROM glob(
        globs=jar_globs,
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE OSPath =~ '.*\\.jar$' AND NOT IsDir
    
    -- Find kernel modules
    LET kernel_module_results = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        IsDir, Mode, "Kernel module" AS FileType
    FROM glob(
        globs=kernel_module_globs,
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE OSPath =~ '.*\\.ko$' AND NOT IsDir
    
    -- Find files in dropper locations
    LET dropper_file_results = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        IsDir, Mode, "Dropper location file" AS FileType
    FROM glob(
        globs=dropper_location_globs,
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find executable files in writable dirs
    LET executable_file_results = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        IsDir, Mode, "Executable in writable dir" AS FileType
    FROM glob(
        globs=(
          "/home/**",
          "/tmp/**",
          "/var/tmp/**",
          "/dev/shm/**"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND Mode.Permissions.Executable AND Mode.Permissions.OtherWrite
    
    -- Find ELF binaries
    LET elf_file_results = SELECT
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        IsDir, Mode, "ELF binary" AS FileType
    FROM glob(
        globs=(
          "/home/**",
          "/usr/local/bin/*",
          "/usr/local/sbin/*",
          "/tmp/**",
          "/var/tmp/**",
          "/dev/shm/**"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND Mode.Permissions.Executable AND 
          read_file(filename=OSPath, length=4, offset=0) =~ '^\\x7fELF'
    
    -- Create a list of queries to run
    LET file_types = SELECT "shell_script_results" AS name FROM scope()
    
    -- Use foreach to process each query type
    LET all_results = SELECT * FROM foreach(
        row={
            SELECT "shell_script_results" AS name FROM scope()
            SELECT "python_script_results" AS name FROM scope()
            SELECT "perl_script_results" AS name FROM scope()
            SELECT "webshell_results" AS name FROM scope()
            SELECT "jar_results" AS name FROM scope()
            SELECT "kernel_module_results" AS name FROM scope()
            SELECT "dropper_file_results" AS name FROM scope()
            SELECT "executable_file_results" AS name FROM scope()
            SELECT "elf_file_results" AS name FROM scope()
        },
        query={
            SELECT * FROM switch(
                a=name,
                shell_script_results=shell_script_results,
                python_script_results=python_script_results,
                perl_script_results=perl_script_results,
                webshell_results=webshell_results,
                jar_results=jar_results,
                kernel_module_results=kernel_module_results,
                dropper_file_results=dropper_file_results,
                executable_file_results=executable_file_results,
                elf_file_results=elf_file_results
            )
        }
    )
    
    -- Apply time filters
    LET time_filtered = SELECT * FROM if(
        condition=MoreRecentThan,
        then={
            SELECT * FROM if(
                condition=ModifiedBefore,
                then={
                    SELECT * FROM all_results 
                    WHERE MTime > MoreRecentThan AND MTime < ModifiedBefore
                },
                else={
                    SELECT * FROM all_results WHERE MTime > MoreRecentThan
                }
            )
        },
        else={
            SELECT * FROM if(
                condition=ModifiedBefore,
                then={
                    SELECT * FROM all_results WHERE MTime < ModifiedBefore
                },
                else=all_results
            )
        }
    )

    -- Final results with upload and hash options
    SELECT 
        OSPath, 
        Inode, 
        Mode, 
        Size, 
        ATime,
        MTime, 
        CTime,
        FileType,
        if(condition=Upload_File AND Mode.IsRegular,
            then=upload(file=OSPath)) AS Upload,
        if(condition=Calculate_Hash AND Mode.IsRegular,
            then=hash(path=OSPath)) AS Hash
    FROM time_filtered

column_types:
  - name: ATime
    type: timestamp
  - name: MTime
    type: timestamp
  - name: CTime
    type: timestamp
  - name: Upload
    type: preview_upload
