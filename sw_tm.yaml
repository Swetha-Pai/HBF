name: Custom.Linux.MaliciousFileFinder
description: |
  Find potentially malicious files on Linux systems including:
  - ELF binaries (native executables)
  - Shell/Python/Perl scripts
  - Java JAR files
  - Malicious web shells (.php, .jsp, etc.)
  - Kernel modules (.ko)
  - Suspicious files in common dropper locations
  - Files with executable permissions in user-writable directories

precondition:
  SELECT * FROM info() where OS = 'linux'

parameters:
  - name: Upload_File
    default: N
    type: bool

  - name: Calculate_Hash
    default: N
    type: bool

  - name: MoreRecentThan
    default: ""
    type: timestamp

  - name: ModifiedBefore
    default: ""
    type: timestamp

  - name: ExcludePathRegex
    default: "^/(proc|sys|run|snap)"
    type: regex
    description: Exclude system paths.

sources:
- query: |
    LET LocalDeviceMajor <= (253,7,8,9,11,65,66,67,68,69,70,71,128,129,130,131,132,133,134,135,202,253,254,259)

    LET RecursionCallback = if(
        condition=ExcludePathRegex,
        then="x=>x.Data.DevMajor IN LocalDeviceMajor AND NOT x.OSPath =~ ExcludePathRegex",
        else="x=>x.Data.DevMajor IN LocalDeviceMajor")

    -- Find shell scripts
    LET shell_scripts = SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Shell script" AS FileType
    FROM glob(
        globs=(
          "/home/**/*.sh",
          "/usr/local/bin/*.sh",
          "/usr/bin/*.sh",
          "/opt/**/*.sh"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find python scripts
    LET python_scripts = SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Python script" AS FileType
    FROM glob(
        globs=(
          "/home/**/*.py",
          "/usr/local/bin/*.py",
          "/usr/bin/*.py",
          "/opt/**/*.py"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find perl scripts
    LET perl_scripts = SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Perl script" AS FileType
    FROM glob(
        globs=(
          "/home/**/*.pl",
          "/usr/local/bin/*.pl",
          "/usr/bin/*.pl",
          "/opt/**/*.pl"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find web shells
    LET web_shells = SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Web shell" AS FileType
    FROM glob(
        globs=(
          "/var/www/**/*.php",
          "/var/www/**/*.jsp",
          "/var/www/**/*.asp",
          "/var/www/**/*.aspx",
          "/var/www/**/*.cgi",
          "/usr/share/nginx/**/*.php",
          "/usr/share/nginx/**/*.jsp",
          "/usr/share/apache*/**/*.php",
          "/usr/share/apache*/**/*.jsp"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find JAR files
    LET jar_files = SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Java JAR" AS FileType
    FROM glob(
        globs=(
          "/home/**/*.jar",
          "/opt/**/*.jar",
          "/usr/local/**/*.jar",
          "/var/www/**/*.jar"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find kernel modules
    LET kernel_modules = SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Kernel module" AS FileType
    FROM glob(
        globs=(
          "/lib/modules/**/*.ko",
          "/usr/lib/modules/**/*.ko",
          "/home/**/*.ko"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find files in dropper locations
    LET dropper_files = SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Dropper location file" AS FileType
    FROM glob(
        globs=(
          "/tmp/**",
          "/var/tmp/**",
          "/dev/shm/**"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find executable files in writable dirs
    LET executable_files = SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Executable in writable dir" AS FileType
    FROM glob(
        globs=(
          "/home/**",
          "/tmp/**",
          "/var/tmp/**",
          "/dev/shm/**"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND Mode.Permissions.Executable AND Mode.Permissions.OtherWrite
    
    -- Find ELF binaries
    LET elf_files = SELECT
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "ELF binary" AS FileType
    FROM glob(
        globs=(
          "/home/**",
          "/usr/local/bin/*",
          "/usr/local/sbin/*",
          "/tmp/**",
          "/var/tmp/**",
          "/dev/shm/**"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND Mode.Permissions.Executable AND 
          read_file(filename=OSPath, length=4, offset=0) =~ '^\\x7fELF'
    
    -- Create a separate source for each file type
    LET all_sources = SELECT * FROM foreach(
        row={
            SELECT "shell_scripts" AS source FROM scope()
            SELECT "python_scripts" AS source FROM scope()
            SELECT "perl_scripts" AS source FROM scope()
            SELECT "web_shells" AS source FROM scope()
            SELECT "jar_files" AS source FROM scope()
            SELECT "kernel_modules" AS source FROM scope()
            SELECT "dropper_files" AS source FROM scope()
            SELECT "executable_files" AS source FROM scope()
            SELECT "elf_files" AS source FROM scope()
        },
        query={
            SELECT * FROM switch(
                a=source,
                shell_scripts=shell_scripts,
                python_scripts=python_scripts,
                perl_scripts=perl_scripts,
                web_shells=web_shells,
                jar_files=jar_files,
                kernel_modules=kernel_modules,
                dropper_files=dropper_files,
                executable_files=executable_files,
                elf_files=elf_files
            )
        }
    )
    
    -- Apply time filters
    LET filtered_results = SELECT * FROM all_sources WHERE
        if(condition=MoreRecentThan,
            then=if(condition=ModifiedBefore,
                    then=MTime > MoreRecentThan AND MTime < ModifiedBefore,
                    else=MTime > MoreRecentThan),
            else=if(condition=ModifiedBefore,
                    then=MTime < ModifiedBefore,
                    else=TRUE))
    
    -- Final output with upload and hash options
    SELECT 
        OSPath, 
        Inode, 
        Mode, 
        Size, 
        ATime,
        MTime, 
        CTime,
        FileType,
        if(condition=Upload_File,
            then=upload(file=OSPath)) AS Upload,
        if(condition=Calculate_Hash,
            then=hash(path=OSPath)) AS Hash
    FROM filtered_results
