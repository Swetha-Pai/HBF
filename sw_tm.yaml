name: Custom.Linux.MaliciousFileFinder
description: |
  Find potentially malicious files on Linux systems including:
  - ELF binaries (native executables)
  - Shell/Python/Perl scripts
  - Java JAR files
  - Malicious web shells (.php, .jsp, etc.)
  - Kernel modules (.ko)
  - Suspicious files in common dropper locations
  - Files with executable permissions in user-writable directories

precondition:
  SELECT * FROM info() where OS = 'linux'

parameters:
  - name: Upload_File
    default: N
    type: bool

  - name: Calculate_Hash
    default: N
    type: bool

  - name: MoreRecentThan
    default: ""
    type: timestamp

  - name: ModifiedBefore
    default: ""
    type: timestamp

  - name: ExcludePathRegex
    default: "^/(proc|sys|run|snap)"
    type: regex
    description: Exclude system paths.

sources:
- query: |
    LET LocalDeviceMajor <= (253,7,8,9,11,65,66,67,68,69,70,71,128,129,130,131,132,133,134,135,202,253,254,259)

    LET RecursionCallback = if(
        condition=ExcludePathRegex,
        then="x=>x.Data.DevMajor IN LocalDeviceMajor AND NOT x.OSPath =~ ExcludePathRegex",
        else="x=>x.Data.DevMajor IN LocalDeviceMajor")

    -- Find shell scripts
    SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Shell script" AS FileType,
        if(condition=Upload_File,
            then=upload(file=OSPath)) AS Upload,
        if(condition=Calculate_Hash,
            then=hash(path=OSPath)) AS Hash
    FROM glob(
        globs=(
          "/home/**/*.sh",
          "/usr/local/bin/*.sh",
          "/usr/bin/*.sh",
          "/opt/**/*.sh"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND 
        if(condition=MoreRecentThan,
            then=if(condition=ModifiedBefore,
                    then=Mtime > MoreRecentThan AND Mtime < ModifiedBefore,
                    else=Mtime > MoreRecentThan),
            else=if(condition=ModifiedBefore,
                    then=Mtime < ModifiedBefore,
                    else=TRUE))

    -- Find python scripts
    SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Python script" AS FileType,
        if(condition=Upload_File,
            then=upload(file=OSPath)) AS Upload,
        if(condition=Calculate_Hash,
            then=hash(path=OSPath)) AS Hash
    FROM glob(
        globs=(
          "/home/**/*.py",
          "/usr/local/bin/*.py",
          "/usr/bin/*.py",
          "/opt/**/*.py"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND 
        if(condition=MoreRecentThan,
            then=if(condition=ModifiedBefore,
                    then=Mtime > MoreRecentThan AND Mtime < ModifiedBefore,
                    else=Mtime > MoreRecentThan),
            else=if(condition=ModifiedBefore,
                    then=Mtime < ModifiedBefore,
                    else=TRUE))
    
    -- Find perl scripts
    SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Perl script" AS FileType,
        if(condition=Upload_File,
            then=upload(file=OSPath)) AS Upload,
        if(condition=Calculate_Hash,
            then=hash(path=OSPath)) AS Hash
    FROM glob(
        globs=(
          "/home/**/*.pl",
          "/usr/local/bin/*.pl",
          "/usr/bin/*.pl",
          "/opt/**/*.pl"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND 
        if(condition=MoreRecentThan,
            then=if(condition=ModifiedBefore,
                    then=Mtime > MoreRecentThan AND Mtime < ModifiedBefore,
                    else=Mtime > MoreRecentThan),
            else=if(condition=ModifiedBefore,
                    then=Mtime < ModifiedBefore,
                    else=TRUE))
    
    -- Find web shells
    SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Web shell" AS FileType,
        if(condition=Upload_File,
            then=upload(file=OSPath)) AS Upload,
        if(condition=Calculate_Hash,
            then=hash(path=OSPath)) AS Hash
    FROM glob(
        globs=(
          "/var/www/**/*.php",
          "/var/www/**/*.jsp",
          "/var/www/**/*.asp",
          "/var/www/**/*.aspx",
          "/var/www/**/*.cgi",
          "/usr/share/nginx/**/*.php",
          "/usr/share/nginx/**/*.jsp",
          "/usr/share/apache*/**/*.php",
          "/usr/share/apache*/**/*.jsp"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND 
        if(condition=MoreRecentThan,
            then=if(condition=ModifiedBefore,
                    then=Mtime > MoreRecentThan AND Mtime < ModifiedBefore,
                    else=Mtime > MoreRecentThan),
            else=if(condition=ModifiedBefore,
                    then=Mtime < ModifiedBefore,
                    else=TRUE))
    
    -- Find JAR files
    SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Java JAR" AS FileType,
        if(condition=Upload_File,
            then=upload(file=OSPath)) AS Upload,
        if(condition=Calculate_Hash,
            then=hash(path=OSPath)) AS Hash
    FROM glob(
        globs=(
          "/home/**/*.jar",
          "/opt/**/*.jar",
          "/usr/local/**/*.jar",
          "/var/www/**/*.jar"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND 
        if(condition=MoreRecentThan,
            then=if(condition=ModifiedBefore,
                    then=Mtime > MoreRecentThan AND Mtime < ModifiedBefore,
                    else=Mtime > MoreRecentThan),
            else=if(condition=ModifiedBefore,
                    then=Mtime < ModifiedBefore,
                    else=TRUE))
    
    -- Find kernel modules
    SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Kernel module" AS FileType,
        if(condition=Upload_File,
            then=upload(file=OSPath)) AS Upload,
        if(condition=Calculate_Hash,
            then=hash(path=OSPath)) AS Hash
    FROM glob(
        globs=(
          "/lib/modules/**/*.ko",
          "/usr/lib/modules/**/*.ko",
          "/home/**/*.ko"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND 
        if(condition=MoreRecentThan,
            then=if(condition=ModifiedBefore,
                    then=Mtime > MoreRecentThan AND Mtime < ModifiedBefore,
                    else=Mtime > MoreRecentThan),
            else=if(condition=ModifiedBefore,
                    then=Mtime < ModifiedBefore,
                    else=TRUE))
    
    -- Find files in dropper locations
    SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Dropper location file" AS FileType,
        if(condition=Upload_File,
            then=upload(file=OSPath)) AS Upload,
        if(condition=Calculate_Hash,
            then=hash(path=OSPath)) AS Hash
    FROM glob(
        globs=(
          "/tmp/**",
          "/var/tmp/**",
          "/dev/shm/**"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND 
        if(condition=MoreRecentThan,
            then=if(condition=ModifiedBefore,
                    then=Mtime > MoreRecentThan AND Mtime < ModifiedBefore,
                    else=Mtime > MoreRecentThan),
            else=if(condition=ModifiedBefore,
                    then=Mtime < ModifiedBefore,
                    else=TRUE))
    
    -- Find executable files in writable dirs
    SELECT 
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "Executable in writable dir" AS FileType,
        if(condition=Upload_File,
            then=upload(file=OSPath)) AS Upload,
        if(condition=Calculate_Hash,
            then=hash(path=OSPath)) AS Hash
    FROM glob(
        globs=(
          "/home/**",
          "/tmp/**",
          "/var/tmp/**",
          "/dev/shm/**"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND Mode.Permissions.Executable AND Mode.Permissions.OtherWrite AND
        if(condition=MoreRecentThan,
            then=if(condition=ModifiedBefore,
                    then=Mtime > MoreRecentThan AND Mtime < ModifiedBefore,
                    else=Mtime > MoreRecentThan),
            else=if(condition=ModifiedBefore,
                    then=Mtime < ModifiedBefore,
                    else=TRUE))
    
    -- Find ELF binaries
    SELECT
        OSPath, 
        Sys.mft as Inode, 
        Mode.String AS Mode, 
        Size,
        Mtime AS MTime, 
        Atime AS ATime, 
        Ctime AS CTime,
        "ELF binary" AS FileType,
        if(condition=Upload_File,
            then=upload(file=OSPath)) AS Upload,
        if(condition=Calculate_Hash,
            then=hash(path=OSPath)) AS Hash
    FROM glob(
        globs=(
          "/home/**",
          "/usr/local/bin/*",
          "/usr/local/sbin/*",
          "/tmp/**",
          "/var/tmp/**",
          "/dev/shm/**"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND Mode.Permissions.Executable AND 
          read_file(filename=OSPath, length=4, offset=0) =~ '^\\x7fELF' AND
        if(condition=MoreRecentThan,
            then=if(condition=ModifiedBefore,
                    then=Mtime > MoreRecentThan AND Mtime < ModifiedBefore,
                    else=Mtime > MoreRecentThan),
            else=if(condition=ModifiedBefore,
                    then=Mtime < ModifiedBefore,
                    else=TRUE))

column_types:
  - name: ATime
    type: timestamp
  - name: MTime
    type: timestamp
  - name: CTime
    type: timestamp
  - name: Upload
    type: preview_upload
