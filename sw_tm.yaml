name: Custom.Linux.MaliciousFileFinder
description: |
  Find potentially malicious files on Linux systems including:
  - ELF binaries (native executables)
  - Shell/Python/Perl scripts
  - Java JAR files
  - Malicious web shells (.php, .jsp, etc.)
  - Kernel modules (.ko)
  - Suspicious files in common dropper locations
  - Files with executable permissions in user-writable directories

precondition:
  SELECT * FROM info() where OS = 'linux'

parameters:
  - name: Upload_File
    default: N
    type: bool

  - name: Calculate_Hash
    default: N
    type: bool

  - name: MoreRecentThan
    default: ""
    type: timestamp

  - name: ModifiedBefore
    default: ""
    type: timestamp

  - name: ExcludePathRegex
    default: "^/(proc|sys|run|snap)"
    type: regex
    description: Exclude system paths.

sources:
- query: |
    LET LocalDeviceMajor <= (253,7,8,9,11,65,66,67,68,69,70,71,128,129,130,131,132,133,134,135,202,253,254,259)

    LET RecursionCallback = if(
        condition=ExcludePathRegex,
        then="x=>x.Data.DevMajor IN LocalDeviceMajor AND NOT x.OSPath =~ ExcludePathRegex",
        else="x=>x.Data.DevMajor IN LocalDeviceMajor")

    -- Find shell scripts
    LET shell_scripts = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        "Shell script" AS FileType
    FROM glob(
        globs=(
          "/home/**/*.sh",
          "/usr/local/bin/*.sh",
          "/usr/bin/*.sh",
          "/opt/**/*.sh"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find python scripts
    LET python_scripts = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        "Python script" AS FileType
    FROM glob(
        globs=(
          "/home/**/*.py",
          "/usr/local/bin/*.py",
          "/usr/bin/*.py",
          "/opt/**/*.py"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find perl scripts
    LET perl_scripts = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        "Perl script" AS FileType
    FROM glob(
        globs=(
          "/home/**/*.pl",
          "/usr/local/bin/*.pl",
          "/usr/bin/*.pl",
          "/opt/**/*.pl"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find web shells
    LET web_shells = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        "Web shell" AS FileType
    FROM glob(
        globs=(
          "/var/www/**/*.php",
          "/var/www/**/*.jsp",
          "/var/www/**/*.asp",
          "/var/www/**/*.aspx",
          "/var/www/**/*.cgi",
          "/usr/share/nginx/**/*.php",
          "/usr/share/nginx/**/*.jsp",
          "/usr/share/apache*/**/*.php",
          "/usr/share/apache*/**/*.jsp"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find JAR files
    LET jar_files = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        "Java JAR" AS FileType
    FROM glob(
        globs=(
          "/home/**/*.jar",
          "/opt/**/*.jar",
          "/usr/local/**/*.jar",
          "/var/www/**/*.jar"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find kernel modules
    LET kernel_modules = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        "Kernel module" AS FileType
    FROM glob(
        globs=(
          "/lib/modules/**/*.ko",
          "/usr/lib/modules/**/*.ko",
          "/home/**/*.ko"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find files in dropper locations
    LET dropper_files = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        "Dropper location file" AS FileType
    FROM glob(
        globs=(
          "/tmp/**",
          "/var/tmp/**",
          "/dev/shm/**"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir
    
    -- Find executable files in writable dirs
    LET executable_files = SELECT 
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        "Executable in writable dir" AS FileType
    FROM glob(
        globs=(
          "/home/**",
          "/tmp/**",
          "/var/tmp/**",
          "/dev/shm/**"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND Mode.Permissions.Executable AND Mode.Permissions.OtherWrite
    
    -- Find ELF binaries
    LET elf_files = SELECT
        OSPath, Sys.mft as Inode, Mode.String AS Mode, Size,
        Mtime AS MTime, Atime AS ATime, Ctime AS CTime,
        "ELF binary" AS FileType
    FROM glob(
        globs=(
          "/home/**",
          "/usr/local/bin/*",
          "/usr/local/sbin/*",
          "/tmp/**",
          "/var/tmp/**",
          "/dev/shm/**"
        ),
        recursion_callback=RecursionCallback,
        one_filesystem=false,
        accessor="file", 
        nosymlink=false
    )
    WHERE NOT IsDir AND Mode.Permissions.Executable AND 
          read_file(filename=OSPath, length=4, offset=0) =~ '^\\x7fELF'
    
    -- Process shell scripts
    LET shell_results = SELECT * FROM shell_scripts
    
    -- Process python scripts
    LET python_results = SELECT * FROM python_scripts
    
    -- Process perl scripts
    LET perl_results = SELECT * FROM perl_scripts
    
    -- Process web shells
    LET webshell_results = SELECT * FROM web_shells
    
    -- Process JAR files
    LET jar_results = SELECT * FROM jar_files
    
    -- Process kernel modules
    LET kernel_results = SELECT * FROM kernel_modules
    
    -- Process dropper files
    LET dropper_results = SELECT * FROM dropper_files
    
    -- Process executable files
    LET exec_results = SELECT * FROM executable_files
    
    -- Process ELF files
    LET elf_results = SELECT * FROM elf_files
    
    -- Combine all results (using a simpler approach)
    LET all_results = SELECT * FROM chain(
        a=shell_results, 
        b=python_results,
        c=perl_results,
        d=webshell_results,
        e=jar_results,
        f=kernel_results,
        g=dropper_results,
        h=exec_results,
        i=elf_results
    )
    
    -- Apply time filters
    LET time_filtered = SELECT * FROM if(
        condition=MoreRecentThan,
        then={
            SELECT * FROM if(
                condition=ModifiedBefore,
                then={
                    SELECT * FROM all_results 
                    WHERE MTime > MoreRecentThan AND MTime < ModifiedBefore
                },
                else={
                    SELECT * FROM all_results WHERE MTime > MoreRecentThan
                }
            )
        },
        else={
            SELECT * FROM if(
                condition=ModifiedBefore,
                then={
                    SELECT * FROM all_results WHERE MTime < ModifiedBefore
                },
                else=all_results
            )
        }
    )

    -- Final results with upload and hash options
    SELECT 
        OSPath, 
        Inode, 
        Mode, 
        Size, 
        ATime,
        MTime, 
        CTime,
        FileType,
        if(condition=Upload_File,
            then=upload(file=OSPath)) AS Upload,
        if(condition=Calculate_Hash,
            then=hash(path=OSPath)) AS Hash
    FROM time_filtered
    WHERE OSPath

column_types:
  - name: ATime
    type: timestamp
  - name: MTime
    type: timestamp
  - name: CTime
    type: timestamp
  - name: Upload
    type: preview_upload
