name: Custom.Linux.Search.FileFinder
description: |
  Find .sh, .py, .jar files and executable binaries on Linux systems.

precondition:
  SELECT * FROM info() WHERE OS = 'linux'

parameters:
  - name: Upload_File
    default: N
    type: bool

  - name: Calculate_Hash
    default: N
    type: bool

  - name: MoreRecentThan
    default: ""
    type: timestamp

  - name: ModifiedBefore
    default: ""
    type: timestamp

  - name: ExcludePathRegex
    default: "^/(proc|sys|run|snap)"
    type: regex
    description: Exclude system paths.

sources:
- query: |
    LET LocalDeviceMajor <= (253,7,8,9,11,65,66,67,68,69,70,71,128,129,130,131,132,133,134,135,202,253,254,259)

    LET static_globs = (
      "/home/**/*.sh",
      "/home/**/*.py",
      "/home/**/*.jar",
      "/usr/local/bin/*",
      "/usr/local/sbin/*",
      "/usr/bin/*",
      "/usr/sbin/*",
      "/sbin/*",
      "/bin/*",
      "/opt/**/*.sh",
      "/opt/**/*.py",
      "/opt/**/*.jar",
      "/opt/**"
    )

    LET file_search = SELECT 
        OSPath,
        Sys.mft AS Inode,
        Mode.String AS ModeString,
        Size,
        Mtime AS MTime,
        Atime AS ATime,
        Ctime AS CTime,
        IsDir,
        Mode,
        Data
    FROM glob(
        globs=static_globs,
        recursion_callback={
          x => x.Data.DevMajor IN LocalDeviceMajor
          AND (NOT x.OSPath.Match(ExcludePathRegex))
        },
        one_filesystem=false,
        accessor="file",
        nosymlink=false
    )
    WHERE (
        OSPath.Match(r'.*\.(sh|py|jar)$')
        OR (Mode.IsRegular AND Mode.Execute)
    )

    LET filtered_files = SELECT * FROM file_search
      WHERE (
        (MoreRecentThan = "" OR MTime > MoreRecentThan) AND
        (ModifiedBefore = "" OR MTime < ModifiedBefore)
      )

    SELECT 
        OSPath,
        Inode,
        ModeString AS Mode,
        Size,
        ATime,
        MTime,
        CTime,
        if(
          condition=Upload_File AND Mode.IsRegular,
          then=upload(file=OSPath)
        ) AS Upload,
        if(
          condition=Calculate_Hash AND Mode.IsRegular,
          then=hash(path=OSPath)
        ) AS Hash
    FROM filtered_files

column_types:
  - name: ATime
    type: timestamp
  - name: MTime
    type: timestamp
  - name: CTime
    type: timestamp
  - name: Upload
    type: preview_upload
