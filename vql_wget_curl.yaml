name: Custom.Detection.CommandLineDownloads
description: |
  Detects wget/curl downloads with or without explicit output flags,
  including indirect file operations.

parameters:
  - name: HistoryPaths
    default: |
      /home/*/.*_history
      /root/.*_history
      C:\\Users\\*\\AppData\\Roaming\\Microsoft\\Windows\\PowerShell\\*\\History*

sources:
  - query: |
      LET history_files = SELECT OSPath, Mtime, Username
        FROM glob(globs=split(string=HistoryPaths, sep="\n"))
        WHERE Size > 0

      SELECT * FROM foreach(
        row=history_files,
        query={
          SELECT OSPath,
            Mtime,
            Username,
            Line AS FullCommand,
            if(
              condition=Line =~ "(wget|curl)\\s+.*https?://",
              then=regex_replace(
                source=Line,
                re=".*(wget|curl)\\b.*",
                replace="$1"
              )
            ) AS DownloadTool
          FROM parse_lines(filename=OSPath, accessor="auto")
          WHERE DownloadTool
        })
